name: Version Release

# Version bumps drive releases.
#
# Bumping `version` in pkg/pve/package.json is the single action that cuts a
# release: this workflow notices the change, creates the matching tag, and
# invokes release.yml to build and publish the chart.
#
# The branch decides what kind of release it is:
#   dev    -> v<version>-dev, published as a GitHub prerelease
#   master -> v<version>,      published as the stable release
# The -dev suffix lives only in the tag; package.json always carries a plain
# x.y.z version.
#
# WHY THE PATH FILTER IS EXACTLY ONE FILE
# ---------------------------------------
# release.yml commits the built chart artifacts (assets/, charts/, extensions/,
# index.yaml) back to the branch. Watching only pkg/pve/package.json means that
# write can never re-trigger this workflow. Do NOT broaden this filter to
# `pkg/**` — that creates an infinite release loop.
on:
  push:
    branches: [master, dev]
    paths:
      - pkg/pve/package.json

concurrency:
  group: version-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Gather versions
        id: gather
        shell: bash
        run: |
          set -euo pipefail
          PKG=pkg/pve/package.json

          echo "new=$(jq -r '.version' "$PKG")" >> "$GITHUB_OUTPUT"

          BEFORE="${{ github.event.before }}"
          OLD=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            OLD="$(git show "$BEFORE:$PKG" 2>/dev/null | jq -r '.version' 2>/dev/null || true)"
          fi
          echo "old=$OLD" >> "$GITHUB_OUTPUT"

      - name: Decide release
        id: check
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          NEW_VERSION: ${{ steps.gather.outputs.new }}
          OLD_VERSION: ${{ steps.gather.outputs.old }}
        run: |
          set -euo pipefail
          EXISTING_TAGS="$(git tag --list)" \
            bash .github/scripts/detect-release.sh

      - name: Create and push tag
        if: steps.check.outputs.bumped == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.check.outputs.tag }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG (package version bump)"
          git push origin "refs/tags/$TAG"
          echo "::notice::created tag $TAG"

  # Invoked directly rather than via the tag push: a tag pushed with the default
  # GITHUB_TOKEN does not start workflow runs.
  release:
    name: Release
    needs: detect
    if: needs.detect.outputs.bumped == 'true'
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.detect.outputs.tag }}
      prerelease: ${{ needs.detect.outputs.prerelease == 'true' }}
    permissions:
      contents: write
    secrets: inherit
