name: Release

# Builds the extension package(s) with `yarn build-pkg` + `yarn publish-pkgs`
# and commits the resulting chart assets (assets/, charts/, extensions/,
# index.yaml) directly back to the master branch, so users can add this
# repository as an "Extension Repository" in Rancher pointing at master.
#
# Trigger options:
#   - workflow_dispatch: manual, pin a specific tag via `tag`
#   - push tag v*:        standard release path, tag name becomes the version
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v0.1.0. Must already exist.
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref }}

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.8.0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install dependencies
        run: yarn install --network-timeout 600000

      - name: Build and publish extension charts
        run: yarn publish-pkgs -s ${{ github.repository }} -b master -t ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}