name: Release

# Builds the extension package(s) and publishes the resulting chart assets
# (assets/, charts/, extensions/, index.yaml) directly back to the master
# branch, so users can add this repository as an "Extension Repository" in
# Rancher pointing at master.
#
# Invoked only by version-release.yml, which owns tagging. There is deliberately
# no tag-push or manual trigger: `version` in pkg/pve/package.json is the single
# source of truth, so a release can never disagree with what the extension claims
# to be. To cut a release, bump that version on master.
#
# The incoming `version` is a v-prefixed git tag (e.g. `v0.1.4`). This workflow
# derives the `pve-0.1.4` form the @rancher/shell publish script expects, and
# re-verifies it against pkg/pve/package.json. That check is redundant given the
# caller already guaranteed it — it is kept as a cheap guard against a broken
# detect job silently publishing the wrong version.
on:
  workflow_call:
    inputs:
      version:
        description: Git tag to release, e.g. v0.1.4. Must already exist.
        required: true
        type: string

permissions:
  contents: write

# Releases push commits to master. Two tags landing close together would
# otherwise race, and the loser would die on a non-fast-forward push - losing
# that release's chart assets entirely. Queue them instead of cancelling, since
# a cancelled release is a half-published one.
concurrency:
  group: publish-master
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Check out the tag, not the caller's branch: the tag points at the version
      # bump commit, so this is the tree whose pkg/pve/package.json holds the
      # version being released.
      #
      # fetch-depth: 0 is required, not cosmetic — the publish step below checks
      # out master and pushes a commit. From a shallow clone that push is
      # rejected with "shallow update not allowed".
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Must come after setup-node: enabling Corepack against the runner's
      # preinstalled Node has no effect once setup-node swaps in the toolcache
      # Node 22 that actually runs the build.
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.8.0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      # yarn.lock here is `lockfile v1` (Yarn 1 classic), which has no
      # `--immutable` flag — it accepted and ignored it, so the lockfile was
      # never actually enforced. `--frozen-lockfile` is the Yarn 1 equivalent.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      # The publish script expects a release tag matching `<pkg-name>-<version>`
      # (e.g. `pve-0.1.0`). We use the `v0.1.0` convention for git tags and
      # translate here. The git tag's semver must match the version in
      # pkg/pve/package.json exactly, or this step fails loudly.
      - name: Derive release tag from package version
        id: tag
        run: |
          set -eu
          GIT_TAG="${{ inputs.version }}"
          case "$GIT_TAG" in
            v*) ;;
            *) echo "::error::git tag '$GIT_TAG' must be v-prefixed semver"; exit 1 ;;
          esac

          PKG_VERSION=$(jq -r .version pkg/pve/package.json)
          if [ -z "$PKG_VERSION" ]; then
            echo "::error::missing version field in pkg/pve/package.json"
            exit 1
          fi

          if [ "${GIT_TAG#v}" != "$PKG_VERSION" ]; then
            echo "::error::git tag '$GIT_TAG' does not match pkg/pve/package.json version '$PKG_VERSION'. Bump the package.json version to ${GIT_TAG#v} before re-tagging, or tag with 'v${PKG_VERSION}'."
            exit 1
          fi

          echo "release_tag=pve-${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "git_tag=${GIT_TAG}" >> "$GITHUB_OUTPUT"

      # `-n` skips the publish script's "check existing charts for updates" loop.
      # We always check out a tag, so `assets/` is never present in the runner and
      # that loop can only iterate over an unexpanded `*/*.tgz` glob — producing a
      # wall of bogus tar/md5/yq errors and, worse, spuriously setting the script's
      # BUILT flag. That flag defeats the script's own guard that exits non-zero
      # when the release tag matches no package, so skipping the loop is what makes
      # a tag/version mismatch actually fail the job.
      - name: Build extension charts
        run: yarn publish-pkgs -n -s ${{ github.repository }} -b master -t ${{ steps.tag.outputs.release_tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The publish script only writes artifacts into the working tree and mirrors
      # them into tmp/ — it never pushes. This step is the actual publish: overlay
      # tmp/ onto master so Rancher can consume the repo at that branch.
      - name: Publish chart artifacts to master
        id: publish
        run: |
          set -euo pipefail

          if [ ! -d tmp/assets ]; then
            echo "::error::publish produced no artifacts in tmp/ - nothing to release"
            exit 1
          fi

          # Stash artifacts outside the work tree. We are on a detached tag, and
          # once master carries a published assets/ the branch switch below would
          # otherwise refuse to overwrite these untracked paths.
          STAGING="$(mktemp -d)"
          cp -r tmp/. "$STAGING/"
          rm -rf tmp assets charts extensions index.yaml

          # Explicit refspec: checkout ran against a tag, so the origin/master
          # remote-tracking ref is not guaranteed to exist yet.
          git fetch origin master:refs/remotes/origin/master
          git checkout -B master origin/master

          # Overlay rather than replace: previously published versions must survive,
          # since the Helm index on master references all of them.
          for DIR in assets charts extensions; do
            if [ -d "$STAGING/$DIR" ]; then
              mkdir -p "$DIR"
              cp -r "$STAGING/$DIR/." "$DIR/"
            fi
          done
          # index.yaml is regenerated by the publish script merged against the copy
          # it fetched from master, so it is already cumulative - replace wholesale.
          if [ -f "$STAGING/index.yaml" ]; then
            cp "$STAGING/index.yaml" index.yaml
          fi

          git add assets charts extensions index.yaml

          if git diff --cached --quiet; then
            echo "::error::no chart changes staged for ${{ steps.tag.outputs.release_tag }} - refusing to report a successful release"
            exit 1
          fi

          # [skip ci] avoids kicking off the CI workflow for a chart-only commit.
          git commit -m "chore(release): publish ${{ steps.tag.outputs.release_tag }} chart [skip ci]"
          git push origin HEAD:master

          # Hand the packaged chart to the Release step. Assert rather than glob,
          # so a rename upstream fails the release instead of quietly attaching
          # nothing to it.
          CHART="assets/pve/${{ steps.tag.outputs.release_tag }}.tgz"
          if [ ! -f "$CHART" ]; then
            echo "::error::expected packaged chart at $CHART, not found"
            exit 1
          fi
          echo "chart=$CHART" >> "$GITHUB_OUTPUT"

      # Runs only after the master push succeeds, so a Release can never point at
      # assets that were never published.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.git_tag }}
          name: ${{ steps.tag.outputs.git_tag }}
          generate_release_notes: true
          files: ${{ steps.publish.outputs.chart }}