name: CI

on:
  pull_request:
  push:
    branches: [master]

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --immutable --network-timeout 600000

      # `yarn build` runs the full-dashboard build which expects a dashboard
      # monorepo layout. Extension repos use `yarn build-pkg <name>` which
      # sets up the .shell symlink and compiles only the package.
      - name: Build extension package
        run: yarn build-pkg pve