# Provider label and blurb shown wherever Rancher lists node drivers: the
# cluster-creation provider grid, the Node Drivers list, and the Cloud Credential
# type picker. Without these keys the dashboard falls back to the raw driver name
# and renders "pve".
#
# The key MUST stay `pve` — it is the driver *id*, not a label. Rancher derives
# that id from the NodeDriver in two different ways depending on the page:
# status.displayName (the binary name) for the cluster-creation grid and the Node
# Drivers list, and spec.displayName for the Cloud Credential type picker. Both
# must therefore read `pve`, which is why the driver chart pins
# `nodeDriver.displayName: pve` rather than a pretty value. This file is the only
# place the human-readable name should live.
cluster:
  provider:
    pve: Proxmox VE
  providerDescription:
    pve: Provision RKE2/K3s nodes as Proxmox VE virtual machines cloned from a template

driver:
  pve:
    auth:
      actions:
        test: Test Connection
        edit: Edit Connection
        addToAllowList: Add host to allow list and retry
      fields:
        apiUrl: Proxmox VE API URL
        apiTokenId: API Token ID
        apiTokenSecret: API Token Secret
        apiInsecure: Skip TLS certificate verification
        caCert: CA Certificate (PEM)
      placeholders:
        apiUrl: https://pve.example.com:8006/api2/json
        apiTokenId: rancher@pve!machine
        apiTokenSecret: The secret printed once by `pveum user token add`
        caCert: |
          -----BEGIN CERTIFICATE-----
          ...
          -----END CERTIFICATE-----
      connected: "Connected to Proxmox VE { version }"
      errors:
        notAllowed: "Rancher could not reach the Proxmox VE server — the host `{ hostname }` is not in the node driver allow list"
        badGateway: "Rancher could not reach the Proxmox VE server — verify the URL uses https and the TLS certificate is signed by a known CA or supply a CA certificate"
        unauthorized: "Unauthorized — verify the API token ID and secret"
        other: "Rancher could not communicate with the Proxmox VE server"
    machine:
      title: Proxmox VE Configuration
      loading: Loading resources from the Proxmox VE server...
      fields:
        node: Target PVE Node
        template: Source Template (VMID)
        cores: CPU Cores
        sockets: CPU Sockets
        memory: Memory (MB)
        disk: Boot Disk Size (GB)
        extraDiskSize: Extra Disk Size (GB)
        extraDiskStorage: Extra Disk Storage
        netBridge: Network Bridge
        netModel: NIC Model
        netVlanTag: VLAN Tag
        vmName: VM Name