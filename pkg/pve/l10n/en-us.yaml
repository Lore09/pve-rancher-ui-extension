# Provider label and blurb shown wherever Rancher lists node drivers: the
# cluster-creation provider grid, the Node Drivers list, and the Cloud Credential
# type picker. Without these keys the dashboard falls back to the raw driver name
# and renders "pve".
#
# The key MUST stay `pve` — it is the driver *id*, not a label. Rancher derives
# that id from the NodeDriver in two different ways depending on the page:
# status.displayName (the binary name) for the cluster-creation grid and the Node
# Drivers list, and spec.displayName for the Cloud Credential type picker. Both
# must therefore read `pve`, which is why the driver chart pins
# `nodeDriver.displayName: pve` rather than a pretty value. This file is the only
# place the human-readable name should live.
cluster:
  provider:
    pve: Proxmox VE
  providerDescription:
    pve: Provision RKE2/K3s nodes as Proxmox VE virtual machines cloned from a template

driver:
  pve:
    auth:
      actions:
        test: Test Connection
        edit: Edit Connection
        addToAllowList: Add host to allow list and retry
      fields:
        apiUrl: Proxmox VE API URL
        apiTokenId: API Token ID
        apiTokenSecret: API Token Secret
        apiInsecure: Skip TLS certificate verification
        caCert: CA Certificate (PEM)
        pool: Resource Pool
      placeholders:
        apiUrl: https://pve.example.com:8006/api2/json
        apiTokenId: rancher@pve!machine
        apiTokenSecret: The secret printed once by `pveum user token add`
        apiTokenSecretEdit: Leave blank to keep the stored secret
        pool: "rancher-managed — optional"
        caCert: |
          -----BEGIN CERTIFICATE-----
          ...
          -----END CERTIFICATE-----
      hints:
        # Rancher stores the token secret write-only and never returns it, so
        # the field is blank on edit. Say so, or it reads as data loss.
        apiInsecure: "Applies to the driver’s own connection to Proxmox VE, not to the Rancher UI proxy, which always verifies. Ticking it ignores the CA certificate above."
        secretWriteOnly: "The token secret is stored write-only, so this field is blank. Leave it blank to keep the existing secret. Test Connection needs one, so it stays disabled until you type it."
        pool: "Proxmox VE resource pool that machines created with this credential are placed into. Set it when the token is scoped to a pool rather than the whole cluster. Leave empty otherwise."
      connected: "Connected to Proxmox VE { version }"
      errors:
        notAllowed: "Rancher could not reach the Proxmox VE server — the host `{ hostname }` is not in the node driver allow list"
        unauthorized: "Unauthorized — verify the API token ID and secret"
        other: "Rancher could not communicate with the Proxmox VE server"
      warnings:
        # Shown when the host *is* allow-listed but Rancher's proxy still cannot
        # reach it. The usual cause is TLS: the proxy validates the PVE
        # certificate against the Rancher server's trust store and has no way to
        # skip it, so the fields above (which the driver honours) do not help
        # here. Provisioning still works, hence a warning and not an error.
        proxyUnverified: "Credentials accepted, but the Rancher UI proxy could not reach or verify { hostname }, usually because Rancher does not trust the Proxmox VE certificate. Provisioning is unaffected; the machine pool dropdowns will be empty, so enter those fields by hand."
    machine:
      title: Proxmox VE Configuration
      loading: Loading resources from the Proxmox VE server...
      sections:
        placement: Placement
        template: Template
        identity: Identity
        resources: Resources
        dataDisks: Data Disks
        networking: Networking
        addressing: Addressing
        cloudInit: Cloud-init
        extraConfig: Additional PVE Options
      warnings:
        # Surfaces as a node that provisions fine and then never reaches Ready,
        # because nothing can log into it. A warning rather than an error — a
        # template that permits root logins is legitimate.
        sshUserRoot: "root is not a valid login for either documented template: Debian uses debian, Leap Micro uses rancher. The node will provision, then fail to bootstrap."
        linkedClone: "The template cannot be deleted or its disk modified while any linked clone exists, and every clone stays dependent on the template’s storage. Needs a snapshot-capable backend: LVM-thin, ZFS, or Ceph RBD."
      errors:
        cloudInitRequired: "A data disk with a filesystem needs cloud-init: the driver formats and mounts it over SSH. Set that disk to Raw instead."
        # Shown in place of the dropdowns when the PVE API cannot be reached
        # through Rancher's proxy. Rendered as a warning, not an error: the
        # driver talks to PVE directly, so a pool configured by hand provisions
        # normally. See `auth.warnings.proxyUnverified`.
        unreachable: "Could not list resources from the Proxmox VE API. Enter the node, template, storage, and bridge by hand; provisioning does not use this proxy and is unaffected."
      placeholders:
        node: "pve1 — as shown under Datacenter in the PVE UI"
        allowedNodes: "pve1, pve2 — optional"
        template: "9000"
        templateTag: "rancher-node"
        description: "Optional — replaces the default note naming the machine and its template"
        diskMount: "/var/lib/longhorn"
        diskStorage: "local-lvm"
        netBridge: "vmbr0"
        vmNamePrefix: "k8s — optional"
        tags: "rancher, prod — optional"
        vmidRange: "200-299 — optional"
        vmUser: "debian for Debian, rancher for Leap Micro"
        ipStart: 192.168.15.150
        ipEnd: 192.168.15.159
        ipPrefix: "24"
        gateway: 192.168.15.1
        nameservers: 10.10.20.1 1.1.1.1
        searchdomain: cluster.lan
        cicustom: "vendor=local:snippets/rancher.yaml — optional"
        extraConfigKey: "cpu"
        extraConfigValue: "host"
      actions:
        addDisk: Add Data Disk
        removeDisk: Remove
        addExtraConfig: Add PVE Option
        removeExtraConfig: Remove
      hints:
        placement: "Which host the machines run on. Leave empty to let the driver pick the online node with the most free memory."
        template: "The image every machine is cloned from. The only setting the driver cannot default."
        identity: "How the machines are named and labelled in Proxmox VE. All optional."
        allowedNodes: "Comma-separated nodes the driver may use, e.g. pve1, pve2. Empty considers every online node. Do not combine with Target PVE Node."
        provisionDelay: "Extra wait after the VM is up, before Rancher starts provisioning. Usually redundant once the cloud-init wait is on; 0 starts immediately."
        templateSource: "By VMID pins this pool to one template. By tag names the image instead, so rolling out a rebuild is one retag in Proxmox VE."
        templateTag: "Tags the template must carry, e.g. rancher-node. Exactly one template must match, resolved per machine at create time."
        templateTagMatch: "Subset: the template carries at least these tags. Exact: exactly these."
        templateTagsSeen: "Tags on templates found on this node: { tags }"
        description: "Written to the VM’s Notes field. Empty writes a line naming the machine and the template it came from."
        cloneStorage: "Storage the clone’s disks land on. Empty uses the template’s own. Full clones only."
        cloneFormat: "Leave at the storage default unless the target is file-based storage; block backends reject anything else. Full clones only."
        cloudinitTimeout: "Seconds to wait for cloud-init to finish inside the guest. A guest without cloud-init is detected and skipped. 0 skips the wait."
        tags: "Comma-separated PVE tags, e.g. rancher, prod. Informational only. Lowercase letters, digits, and _ + . - only."
        # Explains the division of labour the driver implements, so nobody goes
        # looking for a cloud-init drop-in to do it.
        dataDisks: "Attached, then formatted and mounted by the driver before the node joins. Choose Raw to leave the disk untouched, for Ceph, Rook, or Longhorn v2."
        # The model/VLAN/MTU/firewall fields are only applied while rewriting the
        # NIC, which only happens when a bridge is named — say so rather than
        # letting people fill in a VLAN that is silently dropped.
        networking: "Leave the bridge empty to inherit the template’s network. The other fields apply only when a bridge is set."
        addressing: "Static gives each machine an address derived from its VMID, so it needs a VMID range. DNS applies to both modes."
        ipPrefix: "The netmask the machines get, not the size of the pool. Set it to the real network’s prefix, usually 24."
        gateway: "May sit outside the pool. It must be inside the subnet the prefix describes, or the node has no route to it."
        poolCapacity: "This pool holds { count } machines. The VMID range may be wider."
        cloudInit: "Always on. It delivers the SSH key, the static address, and the DNS settings."
        vmidRange: "Allocate VMIDs from this range, e.g. 200-299. Empty lets Proxmox pick the next free id."
        vmNamePrefix: "Prepended to the machine name, so a VM is named prefix-machinename. Letters, digits, and inner hyphens only."
        vmUser: "The account cloud-init creates and that Rancher logs in as. Must match the image: debian for Debian, rancher for Leap Micro."
        resources: "CPU, memory, and the VM’s own disk. Data disks are configured below."
        backup: "On by default, matching Proxmox VE. Worth turning off for worker pools: a node’s boot disk holds no unique state. Data disks have their own setting."
        cicustom: "Points cloud-init at a snippet already uploaded to Proxmox VE, e.g. vendor=local:snippets/rancher.yaml. Use vendor=; user= is rejected."
        extraConfig: "Sets a Proxmox VE config key this form has no field for, e.g. cpu=host. Passed through untouched; keys the driver sets itself are refused."
        linkedClone: "Off means a full copy of the template disk. On shares it instead, which is far faster; read the warning below."
      fs:
        ext4: ext4
        xfs: xfs
        # "none" is what the driver's flag grammar calls it; the UI says what it
        # actually does, because "none" reads like "do not attach a disk".
        none: Raw (unformatted, for Ceph/Rook or Longhorn v2)
      firewall:
        default: Use the PVE default
        enabled: Enabled
        disabled: Disabled
      fields:
        node: Target PVE Node
        allowedNodes: Allowed Nodes
        templateSource: Select Template
        template: Source Template (VMID)
        templateTag: Template Tag
        templateTagMatch: Tag Match
        description: Description
        cloneStorage: Clone Storage
        cloneFormat: Clone Disk Format
        linkedClone: Use linked clone
        tags: Tags
        cores: CPU Cores
        sockets: CPU Sockets
        memory: Memory (MB)
        bootDiskSize: Boot Disk Size (GB)
        cloudinitTimeout: Cloud-init Wait (s)
        provisionDelay: Provision Delay (s)
        diskSize: Size (GB)
        diskStorage: Storage
        diskFs: Filesystem
        diskMount: Mount Path
        diskBackup: Include in PVE backups
        netBridge: Network Bridge
        netModel: NIC Model
        netVlanTag: VLAN Tag
        netMtu: MTU
        netFirewall: PVE Firewall
        backup: Include the boot disk in PVE backups
        cicustom: Cloud-init Snippets
        extraConfigKey: Key
        extraConfigValue: Value
        vmUser: VM User
        vmNamePrefix: VM Name Prefix
        vmidRange: VMID Range
        sshPort: SSH Port
        ipMode: Addressing
        ipStart: Start address
        ipEnd: End address
        ipPrefix: Subnet prefix
        gateway: Gateway
        nameservers: DNS servers
        searchdomain: DNS search domain
      ipModes:
        dhcp: DHCP
        static: Static
      templateSources:
        vmid: By VMID
        tag: By tag
      templateMatches:
        subset: Subset (template has at least these tags)
        exact: Exact (tags are exactly these)
      cloneStorage:
        default: Same storage as the template
      cloneFormats:
        default: Storage default