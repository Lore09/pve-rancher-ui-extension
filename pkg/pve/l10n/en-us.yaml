# Provider label and blurb shown wherever Rancher lists node drivers: the
# cluster-creation provider grid, the Node Drivers list, and the Cloud Credential
# type picker. Without these keys the dashboard falls back to the raw driver name
# and renders "pve".
#
# The key MUST stay `pve` — it is the driver *id*, not a label. Rancher derives
# that id from the NodeDriver in two different ways depending on the page:
# status.displayName (the binary name) for the cluster-creation grid and the Node
# Drivers list, and spec.displayName for the Cloud Credential type picker. Both
# must therefore read `pve`, which is why the driver chart pins
# `nodeDriver.displayName: pve` rather than a pretty value. This file is the only
# place the human-readable name should live.
cluster:
  provider:
    pve: Proxmox VE
  providerDescription:
    pve: Provision RKE2/K3s nodes as Proxmox VE virtual machines cloned from a template

driver:
  pve:
    auth:
      actions:
        test: Test Connection
        edit: Edit Connection
        addToAllowList: Add host to allow list and retry
      fields:
        apiUrl: Proxmox VE API URL
        apiTokenId: API Token ID
        apiTokenSecret: API Token Secret
        apiInsecure: Skip TLS certificate verification
        caCert: CA Certificate (PEM)
      placeholders:
        apiUrl: https://pve.example.com:8006/api2/json
        apiTokenId: rancher@pve!machine
        apiTokenSecret: The secret printed once by `pveum user token add`
        apiTokenSecretEdit: Leave blank to keep the stored secret
        caCert: |
          -----BEGIN CERTIFICATE-----
          ...
          -----END CERTIFICATE-----
      hints:
        # Rancher stores the token secret write-only and never returns it, so
        # the field is blank on edit. Say so, or it reads as data loss.
        apiInsecure: "Applies to the connection the driver makes to Proxmox VE. It does not affect the Rancher UI proxy, which always verifies the certificate, so the machine-pool dropdowns can still fail while provisioning works. When ticked, the CA certificate above is ignored."
        secretWriteOnly: "The API token secret is stored write-only and is never shown again, so this field is blank. Leave it blank to keep the existing secret; type a new one only to replace it. Test Connection needs a secret, so it stays disabled until you enter one — that does not prevent saving."
      connected: "Connected to Proxmox VE { version }"
      errors:
        notAllowed: "Rancher could not reach the Proxmox VE server — the host `{ hostname }` is not in the node driver allow list"
        unauthorized: "Unauthorized — verify the API token ID and secret"
        other: "Rancher could not communicate with the Proxmox VE server"
      warnings:
        # Shown when the host *is* allow-listed but Rancher's proxy still cannot
        # reach it. The usual cause is TLS: the proxy validates the PVE
        # certificate against the Rancher server's trust store and has no way to
        # skip it, so the fields above (which the driver honours) do not help
        # here. Provisioning still works, hence a warning and not an error.
        proxyUnverified: "Credentials accepted, but the Rancher UI proxy could not reach or verify `{ hostname }` — usually because the Rancher server does not trust the Proxmox VE certificate. Provisioning is unaffected: the driver connects to Proxmox VE directly and honours the TLS options above. The machine pool dropdowns will be empty, so enter the node, template, storage and bridge by hand. To populate them, add the Proxmox VE CA to the trusted CAs of the Rancher server."
    machine:
      title: Proxmox VE Configuration
      loading: Loading resources from the Proxmox VE server...
      sections:
        placement: Placement
        sizing: Sizing
      warnings:
        # Surfaces as a node that provisions fine and then never reaches Ready,
        # because nothing can log into it. A warning rather than an error — a
        # template that permits root logins is legitimate.
        sshUserRoot: "SSH User is set to root, which neither documented template permits: the Debian cloud image uses debian and Leap Micro uses rancher. Unless your template explicitly allows root logins, the node will provision and then fail to bootstrap."
        linkedClone: "Linked clone: the template can never be deleted, and its disk can never be modified, while any machine cloned from it still exists — Proxmox enforces this. The template's storage also becomes a dependency for every machine cloned from it: if that storage degrades or saturates, every linked clone degrades with it. Not every storage backend supports linked clones (needs LVM-thin, ZFS, Ceph RBD, or qcow2 on a snapshot-capable filesystem) — on one that doesn't, cloning will fail outright."
      errors:
        cloudInitRequired: "A data disk with a filesystem needs cloud-init: the driver formats and mounts it over SSH with the key cloud-init injects. Enable cloud-init above, or set the filesystem of that disk to Raw."
        # Shown in place of the dropdowns when the PVE API cannot be reached
        # through Rancher's proxy. Rendered as a warning, not an error: the
        # driver talks to PVE directly, so a pool configured by hand provisions
        # normally. See `auth.warnings.proxyUnverified`.
        unreachable: "Could not list resources from the Proxmox VE API. The Rancher UI proxy cannot reach it, usually because the Rancher server does not trust the Proxmox VE certificate. Enter the node, template VMID, storage and bridge by hand; provisioning does not use this proxy and is unaffected."
      placeholders:
        node: "pve1 — as shown under Datacenter in the PVE UI"
        allowedNodes: "pve1, pve2 — optional"
        template: "9000"
        pool: "rancher-managed — optional"
        diskMount: "/var/lib/longhorn"
        diskStorage: "local-lvm"
        netBridge: "vmbr0"
        vmNamePrefix: "k8s — optional"
        tags: "rancher, prod — optional"
        vmidRange: "200-299 — optional"
        vmUser: "debian for Debian, rancher for Leap Micro"
        ipStart: 192.168.15.150
        ipEnd: 192.168.15.159
        ipPrefix: "24"
        gateway: 192.168.15.1
        nameservers: 10.10.20.1 1.1.1.1
        searchdomain: cluster.lan
      actions:
        addDisk: Add Data Disk
        removeDisk: Remove
      hints:
        placement: Where the VM is created and how it is identified in Proxmox VE. Node and Template are the only fields here the driver cannot default.
        allowedNodes: "Comma-separated node names the driver may place VMs on, e.g. pve1, pve2. Empty considers every online node; the driver picks the one with the most free memory. Mutually exclusive with Target PVE Node — set one or the other, not both. No effect on a single-node install."
        pool: "PVE resource pool new VMs are created into. Pair this with an API token whose destructive privileges are granted only on this pool (rather than on the whole cluster) so Rancher can manage the VMs it creates without being able to touch anything else in Proxmox VE — see the driver's rancher-setup.md for the full ACL recipe. Leave empty to create VMs outside any pool, as before."
        tags: "Comma-separated PVE tags applied to the VM, e.g. rancher, prod. Purely informational to Proxmox VE — lets a VM this driver created be found and filtered in the PVE UI. Lowercase letters, digits, and _ + . - only."
        # Explains the division of labour the driver implements, so nobody goes
        # looking for a cloud-init drop-in to do it.
        dataDisks: Each disk is attached to the VM and, unless the filesystem is Raw, formatted and mounted at the given path by the driver before the node joins the cluster. Choose Raw only for storage backends that require an unformatted device, such as Ceph or Rook OSDs, or the Longhorn v2 data engine.
        # The model/VLAN/MTU/firewall fields are only applied while rewriting the
        # NIC, which only happens when a bridge is named — say so rather than
        # letting people fill in a VLAN that is silently dropped.
        networking: Leave the bridge empty to inherit the network of the template untouched. The remaining fields are only applied when a bridge is set.
        addressing: Static addressing gives each machine an address derived from its VMID, so the pool needs a VMID range. The machine with the lowest VMID gets the start address and each later VMID gets the next one. DNS applies in both modes; leave it empty to keep whatever DHCP supplies.
        ipPrefix: The netmask the machines get, not the size of the pool. Set it to the prefix of the real network, usually 24. Writing a small prefix to limit the pool narrows the subnet instead and can leave the gateway unreachable.
        gateway: May sit outside the pool - that is normal. It must be inside the subnet the prefix describes, or the node has no route to it.
        poolCapacity: This pool holds { count } machines. The VMID range may be wider - it only supplies ids, and machines fill the pool from the start address upward.
        cloudInit: Always enabled. Cloud-init is the only channel that delivers the SSH key the driver uses to format data disks and that Rancher uses to bootstrap the node, plus the static address and the DNS settings. There is no supported configuration without it.
        vmidRange: "Allocate VMIDs from this inclusive range, e.g. 200-299, to keep the VMs of one cluster in a predictable band. Leave empty to let Proxmox pick the next free id cluster-wide."
        vmNamePrefix: Prepended to the name Rancher generates, so a VM is named prefix-machinename. Useful for grouping the VMs of one cluster in the Proxmox list. Letters, digits and inner hyphens only.
        vmUser: "The account cloud-init creates and that Rancher and the driver then log in as — one setting, because cloud-init installs the SSH keys for exactly this user. It must match the login user of the image: debian for the Debian cloud image, rancher for Leap Micro."
        linkedClone: "Off by default (full clone): a complete, independent copy of the template disk. Turning this on makes new machines share the template's disk instead of copying it, which is much faster and lighter on storage I/O when several machines provision at once — read the warning below before enabling it."
      fs:
        ext4: ext4
        xfs: xfs
        # "none" is what the driver's flag grammar calls it; the UI says what it
        # actually does, because "none" reads like "do not attach a disk".
        none: Raw (unformatted, for Ceph/Rook or Longhorn v2)
      firewall:
        default: Use the PVE default
        enabled: Enabled
        disabled: Disabled
      fields:
        node: Target PVE Node
        allowedNodes: Allowed Nodes
        template: Source Template (VMID)
        pool: Resource Pool
        linkedClone: Use linked clone
        tags: Tags
        cores: CPU Cores
        sockets: CPU Sockets
        memory: Memory (MB)
        bootDiskSize: Boot Disk Size (GB)
        dataDisks: Data Disks
        diskSize: Size (GB)
        diskStorage: Storage
        diskFs: Filesystem
        diskMount: Mount Path
        diskBackup: Include in PVE backups
        networking: Networking
        netBridge: Network Bridge
        netModel: NIC Model
        netVlanTag: VLAN Tag
        netMtu: MTU
        netFirewall: PVE Firewall
        cloudInit: Cloud-init
        vmUser: VM User
        vmNamePrefix: VM Name Prefix
        vmidRange: VMID Range
        sshPort: SSH Port
        ipMode: Addressing
        ipStart: Start address
        ipEnd: End address
        ipPrefix: Subnet prefix
        gateway: Gateway
        nameservers: DNS servers
        searchdomain: DNS search domain
      ipModes:
        dhcp: DHCP
        static: Static