# Provider label and blurb shown wherever Rancher lists node drivers: the
# cluster-creation provider grid, the Node Drivers list, and the Cloud Credential
# type picker. Without these keys the dashboard falls back to the raw driver name
# and renders "pve".
#
# The key MUST stay `pve` — it is the driver *id*, not a label. Rancher derives
# that id from the NodeDriver in two different ways depending on the page:
# status.displayName (the binary name) for the cluster-creation grid and the Node
# Drivers list, and spec.displayName for the Cloud Credential type picker. Both
# must therefore read `pve`, which is why the driver chart pins
# `nodeDriver.displayName: pve` rather than a pretty value. This file is the only
# place the human-readable name should live.
cluster:
  provider:
    pve: Proxmox VE
  providerDescription:
    pve: Provision RKE2/K3s nodes as Proxmox VE virtual machines cloned from a template

driver:
  pve:
    auth:
      actions:
        test: Test Connection
        edit: Edit Connection
        addToAllowList: Add host to allow list and retry
      fields:
        apiUrl: Proxmox VE API URL
        apiTokenId: API Token ID
        apiTokenSecret: API Token Secret
        apiInsecure: Skip TLS certificate verification
        caCert: CA Certificate (PEM)
      placeholders:
        apiUrl: https://pve.example.com:8006/api2/json
        apiTokenId: rancher@pve!machine
        apiTokenSecret: The secret printed once by `pveum user token add`
        caCert: |
          -----BEGIN CERTIFICATE-----
          ...
          -----END CERTIFICATE-----
      connected: "Connected to Proxmox VE { version }"
      errors:
        notAllowed: "Rancher could not reach the Proxmox VE server — the host `{ hostname }` is not in the node driver allow list"
        unauthorized: "Unauthorized — verify the API token ID and secret"
        other: "Rancher could not communicate with the Proxmox VE server"
      warnings:
        # Shown when the host *is* allow-listed but Rancher's proxy still cannot
        # reach it. The usual cause is TLS: the proxy validates the PVE
        # certificate against the Rancher server's trust store and has no way to
        # skip it, so the fields above (which the driver honours) do not help
        # here. Provisioning still works, hence a warning and not an error.
        proxyUnverified: "Credentials accepted, but Rancher's UI proxy could not reach or verify `{ hostname }` — usually because the Rancher server does not trust the Proxmox VE certificate. Provisioning is unaffected: the driver connects to Proxmox VE directly and honours the TLS options above. The machine pool dropdowns will be empty, so enter the node, template, storage and bridge by hand. To populate them, add the Proxmox VE CA to the Rancher server's trusted CAs."
    machine:
      title: Proxmox VE Configuration
      loading: Loading resources from the Proxmox VE server...
      warnings:
        # Both surface the same failure mode: the node provisions fine and then
        # never reaches Ready, because nothing can log into it. Warnings rather
        # than errors — a template that permits root logins is legitimate.
        sshUserMismatch: "SSH User is \"{ sshUser }\" but the Cloud-init User is \"{ ciuser }\". Cloud-init creates the user named above and Rancher logs in as the SSH User, so if they differ the node provisions but never reaches Ready."
        sshUserRoot: "SSH User is \"root\", which the documented templates do not permit: Debian's cloud image uses \"debian\" and Leap Micro uses \"rancher\". Unless your template explicitly allows root logins, the node will provision and then fail to bootstrap."
      errors:
        cloudInitRequired: "A data disk with a filesystem needs cloud-init: the driver formats and mounts it over SSH with the key cloud-init injects. Enable cloud-init above, or set the disk's filesystem to \"none\" to attach it raw."
        # Shown in place of the dropdowns when the PVE API cannot be reached
        # through Rancher's proxy. Rendered as a warning, not an error: the
        # driver talks to PVE directly, so a pool configured by hand provisions
        # normally. See `auth.warnings.proxyUnverified`.
        unreachable: "Could not list resources from the Proxmox VE API — Rancher's UI proxy cannot reach it, usually because the Rancher server does not trust the Proxmox VE certificate. Enter the node, template VMID, storage and bridge by hand; provisioning does not use this proxy and is unaffected."
      placeholders:
        node: "pve1 — as shown under Datacenter in the PVE UI"
        template: "9000"
        diskMount: "/var/lib/longhorn"
        diskStorage: "local-lvm"
        netBridge: "vmbr0"
        ipconfig: "ip=dhcp"
        vmNamePrefix: "k8s — optional"
        sshUser: "debian or rancher — must match the cloud-init user"
        ciuser: "debian — leave empty to use the image default"
      actions:
        addDisk: Add Data Disk
        removeDisk: Remove
      hints:
        # Explains the division of labour the driver implements, so nobody goes
        # looking for a cloud-init drop-in to do it.
        dataDisks: Each disk is attached to the VM and, unless the filesystem is "none", formatted and mounted at the given path by the driver before the node joins the cluster.
        # The model/VLAN/MTU/firewall fields are only applied while rewriting the
        # NIC, which only happens when a bridge is named — say so rather than
        # letting people fill in a VLAN that is silently dropped.
        networking: Leave the bridge empty to inherit the template's network untouched. The remaining fields are only applied when a bridge is set.
        cloudInit: Required for data disks that get a filesystem — the driver formats and mounts them over SSH using the key cloud-init injects.
        vmNamePrefix: Prepended to the name Rancher generates, as <prefix>-<machine name>. Useful for grouping this cluster's VMs in the Proxmox list. Letters, digits and inner hyphens only.
        sshUser: The account Rancher and the driver log in as. It must be the user that actually exists in the guest — the image's default user, or the cloud-init user above.
      firewall:
        default: Use the PVE default
        enabled: Enabled
        disabled: Disabled
      fields:
        node: Target PVE Node
        template: Source Template (VMID)
        cores: CPU Cores
        sockets: CPU Sockets
        memory: Memory (MB)
        bootDiskSize: Boot Disk Size (GB)
        dataDisks: Data Disks
        diskSize: Size (GB)
        diskStorage: Storage
        diskFs: Filesystem
        diskMount: Mount Path
        diskBackup: Include in PVE backups
        networking: Networking
        netBridge: Network Bridge
        netModel: NIC Model
        netVlanTag: VLAN Tag
        netMtu: MTU
        netFirewall: PVE Firewall
        cloudInit: Cloud-init
        cloudInitEnabled: Configure cloud-init
        ipconfig: IP Config
        ciuser: Cloud-init User
        vmNamePrefix: VM Name Prefix
        sshUser: SSH User
        sshPort: SSH Port